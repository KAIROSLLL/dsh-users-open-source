packages:
  - packages/*

# 主包对伴生包声明的依赖是普通 semver（^0.1.0），不是 workspace:^ ——
# 因为从 Git 源安装时 workspace: 协议解析不了，伴生包会被静默跳过
# （dshmarket 的原话：从 Git 子目录恢复无法满足 workspace: 依赖，npm 可以）。
# 打开下面这项，本地开发时依然链接工作区里的源码，而不是 registry 上的副本。
linkWorkspacePackages: true
# 即使 registry 上已经有同名同版本的包，也优先用工作区里的那份源码。
preferWorkspacePackages: true

minimumReleaseAgeExclude:
  - dsh-users-open-source-workspace@0.1.0
